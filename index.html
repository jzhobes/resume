<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="shortcut icon" href="%BASE_URL%favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#eef1f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12171f" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (() => {
        let mode = 'system';
        try {
          mode = localStorage.getItem('mui-mode') || 'system';
        } catch {
          // Use the system preference when browser storage is unavailable.
        }
        const dark = mode === 'dark' || (mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.add(dark ? 'dark' : 'light');
      })();
    </script>
    <style>
      :root {
        --resume-initial-background: #eef1f5;
        color-scheme: light;
        background: var(--mui-palette-background-default, var(--resume-initial-background));
      }
      :root.dark {
        --resume-initial-background: #12171f;
        color-scheme: dark;
      }
    </style>
    <meta name="description" content="John Ho, Senior Software Engineer specializing in full stack development and technical leadership, with experience in React, TypeScript, Node.js, AWS, digital health, and healthcare IoT." />
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <title>John Ho</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
